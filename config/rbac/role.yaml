---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - cloudprovider.visa.k8s
  resources:
  - visaclouddevices
  - visacloudflavours
  - visacloudimages
  - visacloudsecuritygroups
  - visacloudsidecarconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cloudprovider.visa.k8s
  resources:
  - visacloudinstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cloudprovider.visa.k8s
  resources:
  - visacloudinstances/finalizers
  verbs:
  - update
- apiGroups:
  - cloudprovider.visa.k8s
  resources:
  - visacloudinstances/status
  verbs:
  - get
  - patch
  - update
