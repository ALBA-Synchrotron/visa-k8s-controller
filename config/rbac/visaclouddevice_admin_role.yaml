# This rule is not used by the project visa-k8s-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over cloudprovider.visa.k8s.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: visa-k8s-controller
    app.kubernetes.io/managed-by: kustomize
  name: visaclouddevice-admin-role
rules:
- apiGroups:
  - cloudprovider.visa.k8s
  resources:
  - visaclouddevices
  verbs:
  - '*'
- apiGroups:
  - cloudprovider.visa.k8s
  resources:
  - visaclouddevices/status
  verbs:
  - get
